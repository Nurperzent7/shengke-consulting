<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Shengke">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A3F8F"/>
      <stop offset="1" stop-color="#133269"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="13.5" stroke="#C9A227" stroke-width="1.4" stroke-opacity="0.9"/>

  <!-- Top ribbon of S -->
  <path
    d="M44.5 23.2c-1.4-4.2-5.3-6.8-11.1-6.8-6.4 0-10.8 3.2-10.8 8.1 0 3.7 2.1 5.8 7.6 7.4"
    stroke="#FFFFFF"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Bottom ribbon of S -->
  <path
    d="M19.8 40.8c1.5 4.5 5.7 7.4 12.1 7.4 6.8 0 11.4-3.4 11.4-8.5 0-3.9-2.3-6.2-8.1-7.8"
    stroke="#FFFFFF"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Gold bridge stroke through the gap (follows S flow) -->
  <path
    d="M21.5 36.8c6.2-3.2 12.8-5.2 21.5-6.4"
    stroke="#C9A227"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
